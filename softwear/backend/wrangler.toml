# quickback:contract v2
name = "softwear"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787


# Static Assets (embedded SPAs + spec blobs under __quickback/spec/)
#
# run_worker_first is SECURITY-LOAD-BEARING, not a performance choice: it sends
# every request to the Worker first, so an asset is served only when the Worker
# fetches it. That is what keeps __quickback/spec/ reachable exclusively through
# the gated /openapi.json and /api/*/schema routes. Do not relax it without
# moving gated specs back into the bundle.
[assets]
binding = "ASSETS"
directory = "src/apps"
not_found_handling = "none"
run_worker_first = true


[observability]
enabled = true


# Auth Database (Better Auth tables: users, sessions, accounts, organizations, members, etc.)
[[d1_databases]]
binding = "AUTH_DB"
database_name = "softwear-auth"
database_id = "placeholder-1-auth-db-id"
migrations_dir = "quickback/drizzle/auth"

# Features Database (application tables)
[[d1_databases]]
binding = "DB"
database_name = "softwear-features"
database_id = "placeholder-2-features-db-id"
migrations_dir = "quickback/drizzle/features"

# Security Audit Database (cross-tenant unsafe action logs)
[[d1_databases]]
binding = "AUDIT_DB"
database_name = "softwear-audit"
database_id = "placeholder-6-audit-db-id"
migrations_dir = "quickback/drizzle/audit"


[[kv_namespaces]]
binding = "KV"
id = "placeholder-3-kv-namespace-id"

[[ratelimits]]
name = "RL_200_60"
namespace_id = "60001200"
simple = { limit = 200, period = 60 }
[[ratelimits]]
name = "RL_1000_60"
namespace_id = "60002000"
simple = { limit = 1000, period = 60 }

# Cloudflare Email Service
[[send_email]]
name = "EMAIL"


[vars]
EMAIL_FROM = "noreply@example.com"
EMAIL_FROM_NAME = "softwear | Account Services"
APP_NAME = "softwear"

